gain_drupal_tech_test.settings:
  path: '/admin/config/content/recent-articles-settings'
  defaults:
    _form: '\Drupal\gain_drupal_tech_test\Form\RecentArticlesSettingsForm'
    _title: 'Recent Articles Settings'
  requirements:
    _permission: 'administer site configuration'
    
gain_drupal_tech_test.latest_articles:
  path: '/latest-articles'
  defaults:
    _controller: '\Drupal\gain_drupal_tech_test\Controller\LatestArticlesController::latestArticles'
    _title: 'Latest Articles'
  requirements:
    _permission: 'access latest articles json'
  methods: [GET]